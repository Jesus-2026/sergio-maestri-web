# ===================================================================
#  Panel de administracion - Sergio Maestri
#
#  Los campos estan alineados con los esquemas Zod de
#  src/content.config.ts. Si aca se agrega un campo obligatorio que
#  alla no existe (o al reves), el build falla y avisa.
# ===================================================================

# Autenticacion PKCE de DecapBridge.
# Bloque generado por decapbridge.com al registrar el sitio.
backend:
  name: git-gateway
  repo: Jesus-2026/sergio-maestri-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/5014d60e-291a-4720-a980-aed48f3c4111/pkce
  auth_token_endpoint: /sites/5014d60e-291a-4720-a980-aed48f3c4111/token
  gateway_url: https://gateway.decapbridge.com

  # Cada commit queda firmado con quien lo hizo.
  commit_messages:
    create: 'Crear {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    update: 'Actualizar {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    delete: 'Borrar {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    uploadMedia: 'Subir imagen "{{path}}" - {{author-name}} <{{author-login}}>'
    deleteMedia: 'Borrar imagen "{{path}}" - {{author-name}} <{{author-login}}>'
    openAuthoring: '{{message}} - {{author-name}} <{{author-login}}>'

# Datos del usuario que devuelve PKCE.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://www.sergiomaestri.com.ar

locale: es
publish_mode: simple

# Las imagenes van a src/assets para que Astro las optimice en el build.
# Si fueran a public/ se publicarian sin optimizar.
media_folder: "src/assets/img"
public_folder: "../../assets/img"

collections:

  - name: libros
    label: Libros
    label_singular: Libro
    description: "Las obras publicadas que aparecen en la seccion Obras."
    folder: "src/content/libros"
    create: true
    slug: "{{fields.titulo | slugify}}"
    identifier_field: titulo
    sortable_fields: [orden, anio, titulo]
    media_folder: "/src/assets/img/covers"
    public_folder: "../../assets/img/covers"
    fields:
      - { name: titulo, label: "Titulo", widget: string }
      - name: tipo
        label: "Tipo de obra"
        widget: select
        options: ["Novela", "Poesia", "Cuentos", "Poesia y prosa", "Poesia y relatos", "Biografia", "Infantil"]
      - { name: anio, label: "Ano", widget: number, value_type: int, min: 1900, max: 2100 }
      - name: editorial
        label: "Editorial"
        widget: string
        required: false
        default: ""
        hint: "Dejar vacio si la obra no tiene editorial. Se usa en los datos para Google."
      - name: meta
        label: "Linea bajo el titulo"
        widget: string
        hint: "Lo que se muestra en la tarjeta. Ejemplo - 2017 . Ediciones LeE"
      - { name: portada, label: "Portada", widget: image, choose_url: false }
      - name: alt
        label: "Descripcion de la portada"
        widget: string
        hint: "Para lectores de pantalla y buscadores."
      - name: orden
        label: "Orden"
        widget: number
        value_type: int
        min: 1
        hint: "El 1 aparece primero."
      - { name: body, label: "Sinopsis", widget: markdown }

  - name: premios
    label: Premios
    label_singular: Premio
    description: "Distinciones en certamenes literarios."
    folder: "src/content/premios"
    create: true
    slug: "{{fields.orden}}-{{fields.anio}}"
    identifier_field: titulo
    sortable_fields: [orden, anio]
    fields:
      - { name: anio, label: "Ano", widget: number, value_type: int, min: 1900, max: 2100 }
      - name: titulo
        label: "Certamen y distincion"
        widget: string
        hint: "Nombre del concurso y el premio obtenido."
      - name: detalle
        label: "Obra premiada"
        widget: string
        required: false
        default: ""
        hint: "El poema o cuento que recibio el premio."
      - { name: orden, label: "Orden", widget: number, value_type: int, min: 1 }

  - name: prensa
    label: "Prensa y actividades"
    label_singular: "Bloque de prensa"
    description: "Presentaciones, encuentros y entrevistas."
    folder: "src/content/prensa"
    create: true
    slug: "{{fields.titulo | slugify}}"
    identifier_field: titulo
    sortable_fields: [orden]
    fields:
      - { name: titulo, label: "Titulo del bloque", widget: string }
      - { name: orden, label: "Orden", widget: number, value_type: int, min: 1 }
      - name: items
        label: "Entradas"
        widget: list
        field:
          name: item
          label: "Entrada"
          widget: text
          hint: "Se admite *cursiva* y [texto del enlace](https://...)"

  - name: blog
    label: Blog
    label_singular: "Bloque del blog"
    folder: "src/content/blog"
    create: true
    slug: "{{fields.titulo | slugify}}"
    identifier_field: titulo
    fields:
      - { name: titulo, label: "Titulo del bloque", widget: string }
      - { name: orden, label: "Orden", widget: number, value_type: int, min: 1 }
      - name: items
        label: "Entradas"
        widget: list
        field:
          name: item
          label: "Entrada"
          widget: text
          hint: "Se admite *cursiva* y [texto del enlace](https://...)"

  - name: galerias
    label: "Galerias de fotos"
    label_singular: Galeria
    description: "Diplomas, fotos de prensa y publicaciones en revistas."
    folder: "src/content/galerias"
    create: false
    identifier_field: titulo
    media_folder: "/src/assets/img/galerias"
    public_folder: "../../assets/img/galerias"
    fields:
      - { name: titulo, label: "Titulo de la galeria", widget: string }
      - { name: nota, label: "Nota al pie", widget: string, required: false, default: "" }
      - name: imagenes
        label: "Imagenes"
        label_singular: "Imagen"
        widget: list
        summary: "{{fields.alt}}"
        fields:
          - { name: imagen, label: "Imagen", widget: image, choose_url: false }
          - name: alt
            label: "Descripcion"
            widget: string
            hint: "Que se ve en la foto. Sirve para lectores de pantalla y buscadores."

  - name: secciones
    label: "Textos de seccion"
    description: "La presentacion y la biografia."
    folder: "src/content/secciones"
    create: false
    identifier_field: titulo
    media_folder: "/src/assets/img"
    public_folder: "../../assets/img"
    fields:
      - { name: antetitulo, label: "Antetitulo", widget: string }
      - { name: titulo, label: "Titulo", widget: string }
      - { name: orden, label: "Orden", widget: number, value_type: int, min: 1 }
      - { name: retrato, label: "Imagen", widget: image, required: false, choose_url: false }
      - { name: retratoAlt, label: "Descripcion de la imagen", widget: string, required: false }
      - { name: epigrafe, label: "Epigrafe", widget: string, required: false }
      - name: parrafosLead
        label: "Parrafos junto a la imagen"
        widget: list
        required: false
        field: { name: parrafo, label: "Parrafo", widget: text }
      - { name: cita, label: "Cita destacada", widget: text, required: false }
      - { name: firma, label: "Firma", widget: string, required: false }
      - { name: body, label: "Texto", widget: markdown }

  - name: otras
    label: "Otras publicaciones"
    files:
      - name: publicaciones
        label: "Revistas y antologias"
        file: "src/content/otras/publicaciones.md"
        fields:
          - { name: titulo, label: "Titulo", widget: string }
          - { name: subtitulo, label: "Subtitulo", widget: string, required: false, default: "" }
          - name: items
            label: "Publicaciones"
            widget: list
            field: { name: item, label: "Publicacion", widget: text }

  - name: ajustes
    label: "Ajustes del sitio"
    files:
      - name: sitio
        label: "Portada, contacto y datos del autor"
        file: "src/content/ajustes/sitio.md"
        fields:
          - { name: heroTagline, label: "Bajada de portada", widget: string }
          - { name: heroTitulo, label: "Nombre en la portada", widget: string }
          - { name: heroFrase, label: "Frase de la portada", widget: string }
          - { name: heroCta, label: "Texto del boton", widget: string }
          - { name: heroCtaDestino, label: "Destino del boton", widget: string, default: "#obras" }
          - { name: contactoAntetitulo, label: "Contacto - antetitulo", widget: string }
          - { name: contactoTitulo, label: "Contacto - titulo", widget: string }
          - { name: contactoIntro, label: "Contacto - texto", widget: text }
          - { name: email, label: "Email de contacto", widget: string }
          - name: redes
            label: "Redes sociales"
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: "Nombre", widget: string }
              - { name: url, label: "Enlace", widget: string }
          - { name: nombreCompleto, label: "Nombre completo", widget: string }
          - { name: ocupacion, label: "Ocupacion", widget: string }
          - { name: descripcionAutor, label: "Descripcion para buscadores", widget: text }
          - { name: fechaNacimiento, label: "Fecha de nacimiento", widget: string, hint: "Formato AAAA-MM-DD" }
          - { name: ciudadNacimiento, label: "Ciudad de nacimiento", widget: string }
          - { name: paisNacimiento, label: "Pais (2 letras)", widget: string, default: "AR" }
          - name: temas
            label: "Temas sobre los que escribe"
            widget: list
            field: { name: tema, label: "Tema", widget: string }
          - { name: premiosAntetitulo, label: "Premios - antetitulo", widget: string }
          - { name: premiosTitulo, label: "Premios - titulo", widget: string }
          - { name: obrasAntetitulo, label: "Obras - antetitulo", widget: string }
          - { name: obrasTitulo, label: "Obras - titulo", widget: string }
          - { name: prensaAntetitulo, label: "Prensa - antetitulo", widget: string }
          - { name: prensaTitulo, label: "Prensa - titulo", widget: string }
          - { name: blogAntetitulo, label: "Blog - antetitulo", widget: string }
          - { name: blogTitulo, label: "Blog - titulo", widget: string }
          - { name: blogPie, label: "Blog - texto al pie", widget: string, required: false, default: "" }
