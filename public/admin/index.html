<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />

  <!-- Este panel no debe aparecer en buscadores -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Administración — Sergio Maestri</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f1e7; }
    #cargando {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #534b40; font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div id="cargando">Cargando el panel…</div>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>


  <script>
    window.addEventListener('load', function () {
      var c = document.getElementById('cargando');
      if (c) c.remove();
    });
  </script>
