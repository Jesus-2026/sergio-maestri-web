# Configuración de Netlify para sergio-maestri-escritor.netlify.app

[build]
  # Directorio de publicación (raíz del proyecto)
  publish = "."

  # No hay comando de build porque es un sitio estático simple
  command = ""

# Configuración de headers HTTP
[[headers]]
  # Aplicar a todos los archivos
  for = "/*"
  [headers.values]
    # Seguridad básica
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Headers para sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Headers para imágenes (optimización de caché)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para HTML (no cachear para ver cambios rápidamente)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
