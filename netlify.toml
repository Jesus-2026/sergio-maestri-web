# Configuración de Netlify — Sergio Maestri
# Sitio estático generado con Astro 7

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# ── Seguridad ────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # NOTA: se eliminó X-XSS-Protection. Está obsoleto en todos los
    # navegadores modernos y en su momento introdujo vulnerabilidades
    # propias (XS-Leaks). Se reemplaza por CSP en la Fase 7.

# ── Caché ────────────────────────────────────────────────────

# Assets generados por Astro: llevan hash en el nombre, así que
# son seguros de cachear para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes de contenido: los nombres NO cambian al reemplazarlas.
# Antes estaban con `immutable` a 1 año, lo que impedía que una foto
# actualizada llegara a quien ya había visitado el sitio.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
